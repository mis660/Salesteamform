<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sales Master Form</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-image: url('https://pjejewels.github.io/Sales_Team_Form/ornaments.jpg');
      background-size: cover;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }
    .logo {
      position: fixed;
      top: 10px;
      left: 10px;
      width: 100px;
    }
    .form-container, #loginContainer {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
      border: 1px solid #ddd;
      background-color: rgba(249, 249, 249, 0.95);
      border-radius: 8px;
    }
    label {
      font-weight: bold;
      margin-top: 5px;
      display: block;
    }
    input, select {
      width: 100%;
      padding: 8px;
      margin: 5px 0 15px 0;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      background-color: #4CAF50;
      color: white;
      padding: 10px 20px;
      border: none;
      cursor: pointer;
      width: 100%;
      border-radius: 4px;
      font-weight: bold;
    }
    button:hover { background-color: #45a049; }
    
    .admin-btn {
      background-color: #333;
      margin-top: 10px;
    }
    .admin-btn:hover { background-color: #111; }

    .action-btn {
      padding: 4px 8px;
      font-size: 12px;
      width: auto;
      margin-right: 5px;
    }
    .edit-btn { background-color: #2196F3; }
    .deactivate-btn { background-color: #f44336; }
    .activate-btn { background-color: #ff9800; }

    #successMessage, #errorMessage {
      display: none;
      padding: 10px;
      margin-bottom: 15px;
      color: white;
      text-align: center;
      border-radius: 4px;
    }
    #formContainer, #adminPanel {
      display: none;
    }
    .three-columns {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .three-columns > div {
      flex: 1 1 30%;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: left;
    }
    th { background-color: #eee; }
  </style>
</head>
<body>

<img src="https://pjejewels.github.io/Sales_Team_Form/Logo1.jpg" alt="Logo" class="logo">

<!-- Login Screen -->
<div id="loginContainer">
  <h2>Sales Team Login</h2>
  <label for="username">Username:</label>
  <input type="text" id="username" required>
  
  <label for="password">Password:</label>
  <input type="password" id="password" required>
  
  <button type="button" onclick="login()">Login</button>
  <button type="button" class="admin-btn" onclick="openAdmin()">Admin Access</button>
</div>

<!-- Admin Panel -->
<div id="adminPanel" class="form-container">
  <h2>Admin Panel - Manage Users</h2>
  
  <div style="display: flex; gap: 10px; align-items: center;">
    <input type="text" id="newUserName" placeholder="Enter new user name" style="margin: 0;">
    <button type="button" onclick="adminAddUser()" style="width: 150px;">+ Add User</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="adminTableBody">
      <!-- Generated by JavaScript -->
    </tbody>
  </table>

  <button type="button" class="admin-btn" onclick="closeAdmin()">Log Out Admin</button>
</div>

<!-- Main Sales Form -->
<div id="formContainer" class="form-container">
  <h2>Sales Master Entry Form</h2>
  
  <div id="successMessage"></div>
  <div id="errorMessage"></div>

  <form id="salesForm" onsubmit="return validateForm()">
    <div class="three-columns">
      <div>
        <label for="date">Date:</label>
        <input type="date" id="date" name="date" required>
      </div>
      <div>
        <label for="staffName">Staff Name:</label>
        <select id="staffName" name="staffName" required>
          <option value="">Select Staff</option>
          <!-- Options populated by JavaScript (Only Active Users) -->
        </select>
      </div>
      <div>
        <label for="totalWalkIn">Total Walk-in:</label>
        <input type="number" id="totalWalkIn" name="totalWalkIn" required>
      </div>
    </div>
    
    <div class="three-columns">
      <div><label>Bill:</label><input type="number" name="bill" required></div>
      <div><label>Order:</label><input type="number" name="order" required></div>
      <div><label>Advance:</label><input type="number" name="advance" required></div>
    </div>

    <div class="three-columns">
      <div><label>Return:</label><input type="number" name="returnCount" required></div>
      <div><label>Repair:</label><input type="number" name="repair" required></div>
      <div><label>NPC:</label><input type="number" name="npc" required></div>
    </div>

    <div class="three-columns">
      <div><label>Cancelled Orders:</label><input type="number" name="cancelledOrders" required></div>
      <div><label>NPC Calls:</label><input type="number" name="npcCalls" required></div>
      <div><label>NPC Visit Store:</label><input type="number" name="npcVisitStore" required></div>
    </div>

    <div class="three-columns">
      <div><label>Google Review:</label><input type="number" name="googleReview" required></div>
      <div><label>No. of Reference:</label><input type="number" name="referenceCount" required></div>
      <div><label>Reference Calls:</label><input type="number" name="referenceCalls" required></div>
    </div>

    <div class="three-columns">
      <div><label>Reference Visit:</label><input type="number" name="referenceVisit" required></div>
      <div><label>Birthday's (Count):</label><input type="number" name="birthdayCount" required></div>
      <div><label>Anniversary's (Count):</label><input type="number" name="anniversaryCount" required></div>
    </div>

    <div class="three-columns">
      <div><label>Schemes (Count):</label><input type="number" name="schemesCount" required></div>
      <div><label>Schemes (Value):</label><input type="number" name="schemesValue" required></div>
      <div><label>Sales Return (Count):</label><input type="number" name="salesReturnCount" required></div>
    </div>

    <div class="three-columns">
      <div><label>Sales Return (Value):</label><input type="number" name="salesReturnValue" required></div>
      <div>
        <label>Help First:</label>
        <select name="helpFirst" required>
          <option value="">Select Option</option>
          <option value="Positive">Positive</option>
          <option value="Negative">Negative</option>
        </select>
      </div>
      <div><label>Help First Remarks:</label><input type="text" name="helpFirstRemarks" required></div>
    </div>

    <button type="submit" style="margin-top: 15px;">Submit Form</button>
  </form>
</div>

<script>
  // Initial default staff array updated to include 'active' status
  const defaultStaffList = [
    { name: "Rama Devi", active: true }, { name: "Pavani", active: true },
    { name: "Keerthi", active: true }, { name: "Suman", active: true },
    { name: "Shravani", active: true }, { name: "Ravinder", active: true },
    { name: "Manjunath", active: true }, { name: "Reddy", active: true },
    { name: "K Maruti", active: true }, { name: "Anju", active: true },
    { name: "B Renuka", active: true }, { name: "Ashwini", active: true },
    { name: "Rego Richerd", active: true }, { name: "B Mahesh", active: true },
    { name: "Vijakar", active: true }, { name: "Sandhya", active: true },
    { name: "Ganesh", active: true }, { name: "Nancy", active: true },
    { name: "Krishna", active: true }, { name: "Manasa", active: true },
    { name: "G Keerithi", active: true }, { name: "B Shiva", active: true },
    { name: "Bhushan Singh", active: true }, { name: "Rishab", active: true }
  ];

  document.addEventListener("DOMContentLoaded", initializeApp);

  function initializeApp() {
    let storedData = localStorage.getItem("staffDataProfile");
    if (!storedData) {
      localStorage.setItem("staffDataProfile", JSON.stringify(defaultStaffList));
    }
    loadActiveStaffDropdown();
  }

  // ---- ADMIN FUNCTIONS ----
  function openAdmin() {
    const pin = prompt("Enter Admin PIN:");
    if (pin === "7890") { // CHANGE THIS PIN AS NEEDED
      document.getElementById("loginContainer").style.display = "none";
      document.getElementById("adminPanel").style.display = "block";
      renderAdminTable();
    } else if (pin !== null) {
      alert("Incorrect PIN!");
    }
  }

  function closeAdmin() {
    document.getElementById("adminPanel").style.display = "none";
    document.getElementById("loginContainer").style.display = "block";
    loadActiveStaffDropdown(); // Refresh dropdown for the sales form
  }

  function renderAdminTable() {
    const tbody = document.getElementById("adminTableBody");
    tbody.innerHTML = "";
    
    let staffData = JSON.parse(localStorage.getItem("staffDataProfile"));
    
    // Sort alphabetically
    staffData.sort((a, b) => a.name.localeCompare(b.name));

    staffData.forEach((staff, index) => {
      const tr = document.createElement("tr");
      
      const statusColor = staff.active ? "green" : "red";
      const statusText = staff.active ? "Active" : "Deactivated";
      const toggleBtnClass = staff.active ? "deactivate-btn" : "activate-btn";
      const toggleBtnText = staff.active ? "Deactivate" : "Activate";

      tr.innerHTML = `
        <td>${staff.name}</td>
        <td style="color: ${statusColor}; font-weight: bold;">${statusText}</td>
        <td>
          <button type="button" class="action-btn edit-btn" onclick="adminEditUser('${staff.name}')">✎ Rename</button>
          <button type="button" class="action-btn ${toggleBtnClass}" onclick="adminToggleStatus('${staff.name}')">${toggleBtnText}</button>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  function adminAddUser() {
    const nameInput = document.getElementById("newUserName");
    const name = nameInput.value.trim();
    
    if (name === "") return alert("Please enter a name.");

    let staffData = JSON.parse(localStorage.getItem("staffDataProfile"));
    
    // Check if user already exists
    if (staffData.some(s => s.name.toLowerCase() === name.toLowerCase())) {
      return alert("This user already exists!");
    }

    staffData.push({ name: name, active: true });
    localStorage.setItem("staffDataProfile", JSON.stringify(staffData));
    nameInput.value = "";
    renderAdminTable();
  }

  function adminEditUser(oldName) {
    const newName = prompt(`Enter new name for ${oldName}:`, oldName);
    
    if (newName && newName.trim() !== "" && newName.trim() !== oldName) {
      let staffData = JSON.parse(localStorage.getItem("staffDataProfile"));
      const userIndex = staffData.findIndex(s => s.name === oldName);
      
      if (userIndex !== -1) {
        staffData[userIndex].name = newName.trim();
        localStorage.setItem("staffDataProfile", JSON.stringify(staffData));
        renderAdminTable();
      }
    }
  }

  function adminToggleStatus(name) {
    let staffData = JSON.parse(localStorage.getItem("staffDataProfile"));
    const userIndex = staffData.findIndex(s => s.name === name);
    
    if (userIndex !== -1) {
      // Flip the active status
      staffData[userIndex].active = !staffData[userIndex].active;
      localStorage.setItem("staffDataProfile", JSON.stringify(staffData));
      renderAdminTable();
    }
  }

  // ---- SALES FORM FUNCTIONS ----
  function loadActiveStaffDropdown() {
    const select = document.getElementById("staffName");
    let staffData = JSON.parse(localStorage.getItem("staffDataProfile"));
    
    select.innerHTML = '<option value="">Select Staff</option>';

    // Only add users where active is true
    staffData.forEach(staff => {
      if (staff.active) {
        const option = document.createElement("option");
        option.value = staff.name;
        option.textContent = staff.name;
        select.appendChild(option);
      }
    });
  }

  function login() {
    const user = document.getElementById("username").value;
    const pass = document.getElementById("password").value;
    
    if (user === "CRE@PJEJEWELS.COM" && pass === "PJE@16105!") {
      document.getElementById("loginContainer").style.display = "none";
      document.getElementById("formContainer").style.display = "block";
    } else {
      alert("Invalid username or password");
    }
  }

  function validateForm() {
    const form = document.getElementById("salesForm");
    if (!form.checkValidity()) {
      alert("Please fill all required fields!");
      return false;
    }
    submitForm();
    return false;
  }

  function submitForm() {
    const form = document.getElementById("salesForm");
    const formData = new FormData(form);

    fetch("https://script.google.com/macros/s/AKfycbymeHUhts9BKr2sJeA0SZ7NTf7UjtDDUuD0hFRP_wO9S0jx_eTD6UsB_vWBIaUR3SND/exec", {
      method: "POST",
      body: formData
    })
    .then(response => response.text())
    .then(result => {
      const successMsg = document.getElementById("successMessage");
      const errorMsg = document.getElementById("errorMessage");

      if (result.includes("Duplicate entry")) {
        errorMsg.style.display = "block";
        errorMsg.style.backgroundColor = "red";
        errorMsg.innerText = "Duplicate Entry! Please check and try again.";
        setTimeout(() => errorMsg.style.display = "none", 5000);
      } else {
        form.reset();
        successMsg.style.display = "block";
        successMsg.style.backgroundColor = "green";
        successMsg.innerText = "Form submitted successfully!";
        setTimeout(() => successMsg.style.display = "none", 5000);
      }
    })
    .catch((error) => console.error("Error:", error));
  }
</script>

</body>
</html>
